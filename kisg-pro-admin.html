#kisgAdmin .pa-search{flex:1 1 240px;min-width:0;min-height:38px;padding:7px 12px;border:1px solid var(--line-strong);border-radius:var(--r-pill);background:#fff;font-size:14px}

#kisgAdmin .pa-chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
#kisgAdmin .pa-card{border:1px solid var(--line);border-radius:var(--r-lg);background:#fff}

/* Genel bakış */
#kisgAdmin .pa-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px}
#kisgAdmin .pa-stat{display:flex;flex-direction:column;gap:4px;padding:16px;border:1px solid var(--line);border-radius:var(--r-lg);background:#fff;text-align:left}
#kisgAdmin button.pa-stat:hover{border-color:var(--line-strong)}
#kisgAdmin .pa-stat b{color:var(--ink);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
#kisgAdmin .pa-stat span{color:var(--muted);font-size:13px;font-weight:600}
#kisgAdmin .pa-stat small{color:var(--faint);font-size:12px}

#kisgAdmin .pa-subtitle{margin:4px 0 10px;color:var(--ink);font-size:15px;font-weight:700}

#kisgAdmin .pa-radio{display:flex;flex-wrap:wrap;gap:8px}
#kisgAdmin .pa-radio label{display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line-strong);border-radius:var(--r-pill);font-size:13.5px;font-weight:600}

#kisgAdmin .pa-toast{position:fixed;left:50%;bottom:24px;z-index:60;max-width:min(520px,calc(100% - 32px));padding:12px 18px;border-radius:var(--r-md);background:var(--ink);color:#fff;font-size:14px;transform:translateX(-50%);box-shadow:var(--shadow-pop)}

      frame.setAttribute(A, 'frame');
      let node = frame.parentElement, depth = 0;
      while (node && node !== doc.body && depth < 8) {
        const isSection = node.tagName === 'SECTION', isLayout = node.classList?.contains('block-layout');
        node.setAttribute(A, isSection ? 'section' : isLayout ? 'desktop-layout' : (win.getComputedStyle(node).display === 'grid' ? 'layout' : depth === 0 ? 'element' : 'wrapper'));
        depth++; if (isSection) break; node = node.parentElement;
      }
    }
  } catch {}
  // iframe içinde 100svh iframe'in kendi yüksekliğidir (içerik kısalınca iframe küçülemez); en küçük yükseklik
  // üst sayfanın görünür alanından bir kez hesaplanır.
  if (framed) { try { root.style.setProperty('--pa-min', Math.max(480, Math.round((win || window).innerHeight * 0.75)) + 'px'); } catch { root.style.setProperty('--pa-min', '600px'); } }
  let last = 0;
  const sync = () => {
    if (!framed) return;
    const h = Math.ceil(root.getBoundingClientRect().height);
    if (h && h !== last) {
      last = h;
      try { frame?.style.setProperty('height', h + 'px', 'important'); } catch {}
      try { window.parent.postMessage({ type: 'KISG_EMBED_HEIGHT', source: 'kisg-pro-admin', height: h }, CONFIG.siteUrl); } catch {}
    }
  };
  try { new ResizeObserver(sync).observe(root); } catch { setInterval(sync, 500); }
  const viewportH = () => { try { return (win || window).innerHeight; } catch { return window.innerHeight; } };
  const url = () => { try { return new URL((win || window).location.href); } catch { return new URL(CONFIG.siteUrl + '/pro-admin'); } };
  const setParam = (k, v) => {
    try {
      const w = win || window, u = new URL(w.location.href);
      if (v) u.searchParams.set(k, v); else u.searchParams.delete(k);
      w.history.replaceState(w.history.state, '', u.pathname + u.search + u.hash);
    } catch {}
  };
  const scrollTop = () => { try { if (framed && frame && win) win.scrollTo({ top: Math.max(0, frame.getBoundingClientRect().top + win.scrollY - 8) }); else window.scrollTo({ top: 0 }); } catch {} };
  return { framed, sync, url, setParam, viewportH, scrollTop };
})();

let db = null;
async function client() {
  if (db) return db;
  let c = window.kisgProfessionalSupabaseClient;
  if (!c) {
    if (!window.supabase?.createClient) {
      window.kisgProfessionalSdkReady ||= new Promise((resolve, reject) => {
        const s = document.createElement('script'); s.src = CONFIG.sdkUrl; s.async = true; s.onload = resolve; s.onerror = reject; document.head.append(s);
      });
      try { await window.kisgProfessionalSdkReady; } catch (e) { window.kisgProfessionalSdkReady = null; throw e; }
    }
    c = window.kisgProfessionalSupabaseClient ||= window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  }
  db = c;
  return c;
}

class AdminError extends Error {
  constructor(message, code, auth) { super(message); this.code = code; this.auth = auth; }
}
function explain(err) {
  const raw = `${err?.code || ''} ${err?.message || ''} ${err?.details || ''}`;
  const tail = (/KISG_[A-Z_]+:\s*(.+)$/.exec(err?.message || '') || [])[1] || '';
  if (/KISG_ADMIN_ONLY/.test(raw)) return new AdminError('Bu işlem için yönetici yetkisi gerekiyor.', 'admin_only', true);
  if (/PGRST301|JWT|401/.test(raw) && !/KISG/.test(raw)) return new AdminError('Oturumunuz sona erdi. Lütfen tekrar giriş yapın.', 'session', true);
  if (/KISG_ADMIN_FIELD/.test(raw)) return new AdminError(`Bu alan buradan düzenlenemez: ${tail}`, 'field');
  if (/KISG_ADMIN_TARGET/.test(raw)) return new AdminError('Yönetici hesabına yaptırım uygulanamaz.', 'target');
  if (/KISG_ADMIN_NOT_FOUND/.test(raw)) return new AdminError('Kayıt bulunamadı. Liste yenilendi.', 'not_found');
  if (/KISG_ADMIN_STATE/.test(raw)) return new AdminError(`İşlem yapılamadı: ${tail || 'kayıt durumu uygun değil'}`, 'state');
  if (/KISG_ADMIN_INPUT/.test(raw)) {
    if (/reason/.test(tail)) return new AdminError('Gerekçe zorunlu.', 'input');
    return new AdminError(`Geçersiz giriş: ${tail}`, 'input');
  }
  if (/KISG_USER_(SUSPENDED|BANNED)/.test(raw)) return new AdminError('Kullanıcının yaptırımı var.', 'sanction');
  if (/violates check constraint|23514/.test(raw)) return new AdminError('Girilen değer geçerli değil.', 'check');
  if (/Failed to fetch|NetworkError|network/i.test(raw)) return new AdminError('Bağlantı hatası. Lütfen tekrar deneyin.', 'network');
  return new AdminError('İşlem tamamlanamadı. Lütfen tekrar deneyin.', 'unknown');
}
async function rpc(name, args) {
  const c = await client();
  const { data, error } = await c.rpc(name, args || {});
  if (error) { const e = explain(error); if (e.auth) onAuthLost(e); throw e; }
  return data;
}

const state = { user: null, section: 'overview', pending: 0 };
function gate(pane, message) {
  const g = $('.pa-gate');
  g.dataset.gate = pane === 'ready' ? 'ready' : pane;
  root.querySelectorAll('[data-gate-pane]').forEach(p => { p.hidden = p.dataset.gatePane !== pane; });
  $('.pa-shell').hidden = pane !== 'ready';
  $('[data-me]').hidden = !state.user;
  if (pane === 'error' && message) $('[data-gate-error]').textContent = message;
  host.sync();
}
function onAuthLost(err) {
  if (err.code === 'session') { state.user = null; gate('login'); }
  else if (err.code === 'admin_only') gate('denied');
}
async function boot() {
  gate('loading');
  let c;
  try { c = await client(); } catch { return gate('error', 'Supabase kitaplığı yüklenemedi.'); }
  const { data } = await c.auth.getSession();
  state.user = data?.session?.user || null;
  if (!state.user) return gate('login');
  $('[data-me-mail]').textContent = state.user.email || '';
  let isAdmin = false;
  try { isAdmin = (await rpc('kisg_is_admin')) === true; }
  catch (e) { if (e.code === 'session') return; return gate('error', e.message); }
  if (!isAdmin) return gate('denied');
  gate('ready');
  const initial = host.url().searchParams.get('b');
  show(SECTIONS[initial] ? initial : 'overview', { keepScroll: true });
}
$('[data-gate-pane="login"]').addEventListener('submit', async ev => {
  ev.preventDefault();
  const f = ev.currentTarget, err = $('[data-login-error]'), btn = f.querySelector('button[type="submit"]');
  const email = clean(f.email.value), password = f.password.value;
  err.hidden = true;
  if (!email || !password) { err.textContent = 'E-posta ve şifre gerekli.'; err.hidden = false; return; }
  btn.disabled = true;
  try {
    const c = await client();
    const { error } = await c.auth.signInWithPassword({ email, password });
    if (error) { err.textContent = /invalid/i.test(error.message || '') ? 'E-posta veya şifre hatalı.' : 'Giriş yapılamadı. Lütfen tekrar deneyin.'; err.hidden = false; return; }
    f.reset();
    await boot();
  } catch { err.textContent = 'Bağlantı hatası. Lütfen tekrar deneyin.'; err.hidden = false; }
  finally { btn.disabled = false; }
});
root.addEventListener('click', async ev => {
  const a = ev.target.closest('[data-action]');
  if (!a) return;
  if (a.dataset.action === 'retry') boot();
  if (a.dataset.action === 'logout') { try { await (await client()).auth.signOut(); } catch {} state.user = null; closeLayer(); gate('login'); }
});

let layerReturn = null;

}

// Gerekçe isteyen onay penceresi. fields: ek form alanları (Node). submit(values) → Promise
function confirmDialog({ title, text, confirm = 'Onayla', danger = false, reason = true, reasonLabel = 'Gerekçe', reasonRequired = true, fields = null, submit }) {
  const err = h('p', { class: 'pa-error', hidden: true });
  const reasonEl = reason ? h('textarea', { name: 'reason', maxlength: 1000, required: reasonRequired }) : null;
  const btn = h('button', { type: 'submit', class: `pa-btn ${danger ? 'pa-btn-danger' : 'pa-btn-primary'}`, text: confirm });
  const form = h('form', { class: 'pa-dialog', role: 'dialog', 'aria-modal': 'true', 'aria-label': title, novalidate: true },
    h('h2', { text: title }), text ? h('p', { class: 'pa-muted', text }) : null, fields,
    reason ? h('label', { class: 'pa-field' }, h('span', { text: reasonLabel + (reasonRequired ? '' : ' (isteğe bağlı)') }), reasonEl) : null,
    err, h('div', { class: 'pa-dialog-foot' }, h('button', { type: 'button', class: 'pa-btn', text: 'Vazgeç', onclick: closeLayer }), btn));
  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const reasonText = reasonEl ? clean(reasonEl.value) : '';
    if (reasonEl && reasonRequired && !reasonText) { err.textContent = 'Gerekçe zorunlu.'; err.hidden = false; reasonEl.focus(); return; }
    btn.disabled = true; err.hidden = true;
    // submit yeni bir panel açtıysa (ör. kullanıcı ayrıntısı) bu form katmandan çıkmıştır; yalnız kendimizi kapatırız.
    try { await submit({ reason: reasonText, form }); if (form.isConnected) closeLayer(); }
    catch (e) { err.textContent = e.message || 'İşlem tamamlanamadı.'; err.hidden = false; }
    finally { btn.disabled = false; }
  });
  openLayer(form);
}

function editProfile(p) {
  const inputs = {};
  const fields = h('div', { class: 'pa-grid2' }, PROFILE_FIELDS.map(([k, label, type]) => {
    let el;
    if (type === 'bool') { el = h('input', { type: 'checkbox', name: k }); el.checked = !!p[k]; return h('label', { class: 'pa-check' }, el, h('span', { text: label })); }

    else if (type === 'city') el = pickSelect(k, CITIES.map(c => [c, c]), cityValue(p[k]));
    else if (type === 'cert') el = pickSelect(k, CERTS, certValue(p[k]));

    inputs[k] = el;
    return h('label', { class: 'pa-field', style: type === 'textarea' ? 'grid-column:1/-1' : null }, h('span', { text: label }), el);
  }));
  confirmDialog({
    title: 'Profili düzenle', text: 'Yalnız değiştirdiğiniz alanlar kaydedilir. E-posta, telefon ve premium buradan değiştirilemez.',
    confirm: 'Kaydet', fields,

      await rpc('admin_update_profile', { p_user_id: p.id, p_patch: patch, p_reason: reason });

}

    ['dismissed|none', 'Reddet – ihlal yok']].filter(Boolean);
  const group = h('div', { class: 'pa-radio', style: 'flex-direction:column', role: 'radiogroup', 'aria-label': 'Sonuç' },
    options.map(([v, l], i) => h('label', null, h('input', { type: 'radio', name: 'outcome', value: v, checked: i === (options.length > 3 ? 1 : 0) }), h('span', { text: l }))));
  confirmDialog({
    title: 'Şikâyeti sonuçlandır',
    text: Number(r.same_target_pending) > 1 ? `Aynı hedefe ait ${num(r.same_target_pending)} bekleyen şikâyetin tümü aynı sonuçla kapatılır.` : null,
    confirm: 'Kaydet', fields: group, reasonLabel: 'Not', reasonRequired: false,
    submit: async ({ reason, form }) => {
      const [status, action] = form.elements.outcome.value.split('|');
      await rpc('admin_resolve_report', { p_report_id: r.id, p_status: status, p_note: reason || null, p_content_action: action });
      toast('Şikâyet sonuçlandırıldı.');
      renderReports();
    }
  });
}

/* ---------------------------------------------------------------------------
   Başlat
   --------------------------------------------------------------------------- */
root.dataset.version = CONFIG.version;
boot();
client().then(c => c.auth.onAuthStateChange((event) => { if (event === 'SIGNED_OUT') { state.user = null; closeLayer(); gate('login'); } })).catch(() => {});
})();
</script>
